// Keep the targeted PackStar validation independent of stale benchmark tests
// that reference experiments intentionally omitted from the slim target.
gradle.afterProject { project ->
    if (project == gradle.rootProject) {
        def sourceSets = project.extensions.findByName('sourceSets')
        if (sourceSets != null) {
            def testJava = sourceSets.getByName('test').java
            testJava.exclude('edu/duke/cs/osprey/markstar/bench/GenericPDBBench.java')
            testJava.exclude('edu/duke/cs/osprey/markstar/bench/PackStarScalingBench.java')
            testJava.exclude('edu/duke/cs/osprey/markstar/TestBranchMARKStar.java')
        }
    }
}
